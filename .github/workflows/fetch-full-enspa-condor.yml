name: Recover full ENSPA condor logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-full-enspa-condor.yml'

permissions:
  contents: write

jobs:
  recover-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Download original ENSPA shield from Profesorado
        run: |
          curl --fail --location --retry 4 --retry-delay 2 'https://isfd100-bue.infd.edu.ar/sitio/wp-content/uploads/2018/08/untitled_1.bmp' --output /tmp/enspa-condor.bmp
          file /tmp/enspa-condor.bmp

      - name: Validate and restore full-resolution logo
        run: |
          python -c "from PIL import Image; im=Image.open('/tmp/enspa-condor.bmp'); print(f'Original ENSPA shield: {im.width}x{im.height} mode={im.mode} format={im.format}'); assert im.width >= 200 and im.height >= 200; im.convert('RGB').save('assets/img/logo-ees18.jpg','JPEG',quality=96,subsampling=0,optimize=True); check=Image.open('assets/img/logo-ees18.jpg'); print(f'Restored local logo: {check.width}x{check.height}')"

      - name: Commit restored logo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/logo-ees18.jpg
          git commit -m 'asset: restore full ENSPA condor logo'
          git push origin HEAD:main
