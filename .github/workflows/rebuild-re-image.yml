name: Rebuild RE image

on:
  push:
    branches:
      - feat/reorganizacion-multipagina

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reorganizacion-multipagina
          fetch-depth: 0
      - name: Rebuild source image
        shell: bash
        run: |
          cat tools/re-source/part-*.b64 | base64 -d > assets/img/re-bonaerense-2024.jpg
          echo "faee8257dc69258a7abd3bf98506a56c8c46a925d0db4af79da8a9512ebe2342  assets/img/re-bonaerense-2024.jpg" | sha256sum -c -
      - name: Commit rebuilt image
        shell: bash
        run: |
          if git diff --quiet -- assets/img/re-bonaerense-2024.jpg; then
            echo "Image already matches source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/re-bonaerense-2024.jpg
          git commit -m "fix: restaurar imagen RE Bonaerense en alta resolución"
          git push origin HEAD:feat/reorganizacion-multipagina
