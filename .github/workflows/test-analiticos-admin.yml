name: Test analiticos admin

on:
  pull_request:
    branches: [main]

jobs:
  analiticos-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Apps Script syntax
        run: node --check < apps-script/analiticos-pases/AdminSeguimiento.gs
      - name: Run analiticos sync regression tests
        run: node tests/admin-seguimiento.test.cjs
