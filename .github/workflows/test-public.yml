name: Test public site

on:
  pull_request:
    branches:
      - main

jobs:
  site-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest pillow
      - name: Run Python tests
        run: pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/estado-publico.js
          node --check assets/js/status-config.js
          node --check assets/js/reservas-config.js
          node --check assets/js/reservas-audiovisuales.js
          node --check assets/js/cancelar-reserva.js
      - name: Run JavaScript structure checks
        run: |
          node tests/site.test.js
          node tests/reservas-audiovisuales.test.js
          node tests/apps-script-reservas.test.js
      - name: Probe deployed reservation Web App
        run: python tests/probe_reservas_live.py
      - name: One-shot create pilot reservation
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          from pathlib import Path

          config = Path('assets/js/reservas-config.js').read_text(encoding='utf-8')
          base = re.search(r"EES18_RESERVAS_API_URL\s*=\s*'([^']+)'", config).group(1)

          def get(params):
              url = base + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': 'EES18-e2e-create/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          chosen_date = None
          chosen_slot = None
          for date in ('2026-09-04', '2026-09-07', '2026-09-08'):
              availability = get({'action': 'availability', 'date': date})
              for slot in availability.get('slots', []):
                  if slot.get('available') is True:
                      chosen_date = date
                      chosen_slot = slot.get('id')
                      break
              if chosen_slot:
                  break

          if not chosen_slot:
              raise SystemExit('No free pilot slot found')

          payload = {
              'mode': 'single',
              'date': chosen_date,
              'slotIds': [chosen_slot],
              'teacher': 'PRUEBA SISTEMA E2E',
              'email': 'martin.nicolas.podubinio@gmail.com',
              'course': 'PRUEBA E2E',
              'subject': 'PRUEBA CANCELACION E2E',
              'resources': {'projector': False, 'speakers': False, 'schoolNotebook': False, 'internet': False},
              'observations': 'PRUEBA E2E DESCARTABLE. CANCELAR AL FINALIZAR.'
          }
          result = get({'action': 'create', 'payload': json.dumps(payload, ensure_ascii=False)})
          assert result.get('ok') is True, result
          assert result.get('confirmed') == 1, result
          reservation = result['reservations'][0]
          print('E2E_CREATED_ID=' + reservation['id'])
          print('E2E_CREATED_DATE=' + reservation['date'])
          print('E2E_CREATED_START=' + reservation['start'])
          print('E2E_CREATED_END=' + reservation['end'])
          PY
