name: Test public site

on:
  push:
    branches:
      - fix/pases-equivalencias-publico
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests
        run: pytest tests/test_pases_publico.py -q
