name: Test public site

on:
  pull_request:
    branches:
      - main

jobs:
  site-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest pillow
      - name: Run Python tests
        run: pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/estado-publico.js
          node --check assets/js/status-config.js
          node --check assets/js/reservas-config.js
          node --check assets/js/reservas-audiovisuales.js
          node --check assets/js/cancelar-reserva.js
      - name: Run JavaScript structure checks
        run: |
          node tests/site.test.js
          node tests/reservas-audiovisuales.test.js
          node tests/apps-script-reservas.test.js
      - name: Probe deployed reservation Web App
        run: python tests/probe_reservas_live.py
      - name: One-shot production reservation control
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          from pathlib import Path

          config = Path('assets/js/reservas-config.js').read_text(encoding='utf-8')
          base = re.search(r"EES18_RESERVAS_API_URL\s*=\s*'([^']+)'", config).group(1)

          def get_json(params):
              url = base + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': 'EES18-production-e2e/1.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          target_date = '2026-09-02'
          availability = get_json({'action': 'availability', 'date': target_date})
          free_slots = [slot for slot in availability.get('slots', []) if slot.get('available')]
          assert free_slots, availability
          slot = free_slots[0]

          payload = {
              'mode': 'single',
              'date': target_date,
              'slotIds': [slot['id']],
              'teacher': 'PRUEBA SISTEMA PRODUCCIÓN',
              'email': 'martin.nicolas.podubinio@gmail.com',
              'course': 'PRUEBA E2E',
              'subject': 'PRUEBA CONTROL PRODUCCIÓN',
              'resources': {},
              'observations': 'PRUEBA E2E PRODUCCIÓN DESCARTABLE. CANCELAR AL FINALIZAR.'
          }
          result = get_json({'action': 'create', 'payload': json.dumps(payload, ensure_ascii=False)})
          assert result.get('ok') is True, result
          assert result.get('confirmed') == 1, result
          reservation = result['reservations'][0]
          print('PRODUCTION_E2E_CREATED_ID=' + reservation['id'])
          print('PRODUCTION_E2E_DATE=' + reservation['date'])
          print('PRODUCTION_E2E_SLOT=' + slot['id'])
          print('PRODUCTION_E2E_TIME=' + reservation['start'] + '-' + reservation['end'])
          PY
