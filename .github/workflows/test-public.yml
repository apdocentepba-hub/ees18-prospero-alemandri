name: Test public site

on:
  pull_request:
    branches:
      - main

jobs:
  site-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run Python tests
        run: pytest -q
      - name: Check JavaScript syntax
        run: node --check assets/js/main.js
      - name: Run JavaScript structure checks
        run: node tests/site.test.js
