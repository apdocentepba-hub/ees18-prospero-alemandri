name: Test public site

on:
  pull_request:
    branches:
      - main

jobs:
  site-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest pillow
      - name: Recover original ENSPA shield for one-time migration
        if: github.head_ref == 'recovery/fetch-enspa-condor-source-2026-09-09'
        run: |
          curl --fail --location --retry 4 --retry-delay 2 'https://isfd100-bue.infd.edu.ar/sitio/wp-content/uploads/2018/08/untitled_1.bmp' --output /tmp/enspa-condor.bmp
          file /tmp/enspa-condor.bmp
          python -c "from PIL import Image; im=Image.open('/tmp/enspa-condor.bmp'); print(f'ENSPA shield source: {im.width}x{im.height} mode={im.mode} format={im.format}'); im.convert('RGB').save('/tmp/enspa-condor.jpg','JPEG',quality=96,subsampling=0,optimize=True)"
      - name: Upload recovered ENSPA shield
        if: github.head_ref == 'recovery/fetch-enspa-condor-source-2026-09-09'
        uses: actions/upload-artifact@v4
        with:
          name: enspa-condor-original
          path: /tmp/enspa-condor.jpg
          if-no-files-found: error
      - name: Run Python tests
        run: pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/visitor-counter.js
          node --check assets/js/estado-publico.js
          node --check assets/js/status-config.js
          node --check assets/js/reservas-config.js
          node --check assets/js/reservas-audiovisuales.js
          node --check assets/js/reservas-email-policy.js
          node --check assets/js/cancelar-reserva.js
          if [ -f assets/js/contacto.js ]; then node --check assets/js/contacto.js; fi
          node --check assets/js/novedades.js
          node --check assets/js/novedades-config.js
      - name: Run JavaScript structure checks
        run: |
          node tests/site.test.js
          node tests/site-cleanup.test.js
          node tests/re-bonaerense-year.test.js
          node tests/whatsapp-channel.test.js
          node tests/contact-and-reservation-mail.test.js
          node tests/contact-backend.test.js
          node tests/visitor-counter.test.js
          node tests/reservas-audiovisuales.test.js
          node tests/reservas-single-day-only.test.js
          node tests/apps-script-reservas.test.js
          node tests/abc-email-policy.test.js
          node tests/apps-script-performance.test.js
          node tests/analitico-final.test.js
          node tests/novedades-backend.test.js
          node tests/novedades-client.test.js
          node tests/novedades-pages.test.js
          node tests/visual-integrity.test.js
      - name: Probe deployed reservation Web App
        run: python tests/probe_reservas_live.py
      - name: Probe deployed novedades Web App
        run: python tests/probe_novedades_live.py
