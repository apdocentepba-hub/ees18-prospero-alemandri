name: Test public site

on:
  pull_request:
    branches:
      - main

jobs:
  site-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest pillow
      - name: Run Python tests
        run: pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/estado-publico.js
          node --check assets/js/status-config.js
          node --check assets/js/reservas-config.js
          node --check assets/js/reservas-audiovisuales.js
          node --check assets/js/cancelar-reserva.js
      - name: Run JavaScript structure checks
        run: |
          node tests/site.test.js
          node tests/reservas-audiovisuales.test.js
          node tests/apps-script-reservas.test.js
      - name: Probe deployed reservation Web App
        run: python tests/probe_reservas_live.py
      - name: One-shot production cancellation control
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          from pathlib import Path

          config = Path('assets/js/reservas-config.js').read_text(encoding='utf-8')
          base = re.search(r"EES18_RESERVAS_API_URL\s*=\s*'([^']+)'", config).group(1)
          token = 'dq9crwwJQJxhH3durP11IWLDBSOSP7ay-pGNzKUaBo4'

          def get_json(params):
              url = base + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': 'EES18-production-e2e/1.0'})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.loads(response.read().decode('utf-8'))

          lookup = get_json({'action': 'cancelLookup', 'token': token})
          assert lookup.get('ok') is True, lookup
          assert lookup['reservation']['id'] == '691fe10f-c25b-48fd-8c4d-ee58f673472b', lookup
          print('PRODUCTION_E2E_CANCEL_LOOKUP_OK=' + lookup['reservation']['id'])

          result = get_json({'action': 'cancel', 'token': token})
          assert result.get('ok') is True, result
          print('PRODUCTION_E2E_CANCEL_OK=' + result['reservation']['id'])

          second = get_json({'action': 'cancelLookup', 'token': token})
          assert second.get('ok') is False, second
          assert second.get('code') == 'ALREADY_CANCELLED', second
          print('PRODUCTION_E2E_CANCEL_IDEMPOTENT=' + second['code'])
          PY
