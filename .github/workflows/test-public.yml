name: Test public site

on:
  pull_request:
    branches:
      - main

jobs:
  site-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest pillow
      - name: Run Python tests
        run: pytest -q
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/estado-publico.js
          node --check assets/js/status-config.js
          node --check assets/js/reservas-config.js
          node --check assets/js/reservas-audiovisuales.js
          node --check assets/js/cancelar-reserva.js
      - name: Run JavaScript structure checks
        run: |
          node tests/site.test.js
          node tests/reservas-audiovisuales.test.js
          node tests/apps-script-reservas.test.js
      - name: Probe deployed reservation Web App
        run: python tests/probe_reservas_live.py
      - name: One-shot cancel pilot reservation
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          from pathlib import Path

          config = Path('assets/js/reservas-config.js').read_text(encoding='utf-8')
          base = re.search(r"EES18_RESERVAS_API_URL\s*=\s*'([^']+)'", config).group(1)
          token = '-uhq-a2y8I6zwsXVV-7z7Yvu9BeoMC1UKK0W5uj9exE'
          expected_id = '6f691b71-6c4c-4a53-84c2-e7f3f5b6694d'

          def get(params):
              url = base + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': 'EES18-e2e-cancel/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          lookup = get({'action': 'cancelLookup', 'token': token})
          assert lookup.get('ok') is True, lookup
          assert lookup.get('reservation', {}).get('id') == expected_id, lookup
          assert lookup.get('reservation', {}).get('date') == '2026-09-04', lookup
          print('E2E_CANCEL_LOOKUP_OK=' + lookup['reservation']['id'])

          cancelled = get({'action': 'cancel', 'token': token})
          assert cancelled.get('ok') is True, cancelled
          assert cancelled.get('reservation', {}).get('id') == expected_id, cancelled
          print('E2E_CANCEL_OK=' + cancelled['reservation']['id'])

          second_lookup = get({'action': 'cancelLookup', 'token': token})
          assert second_lookup.get('ok') is False, second_lookup
          assert second_lookup.get('code') == 'ALREADY_CANCELLED', second_lookup
          print('E2E_CANCEL_IDEMPOTENT=ALREADY_CANCELLED')
          PY
