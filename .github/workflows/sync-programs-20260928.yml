name: Sync programas 2026-09-28

on:
  push:
    paths:
      - '.github/workflows/sync-programs-20260928.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar programas y portada
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('programas.html')
          s = p.read_text(encoding='utf-8')

          def once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'No se encontró: {old}')
              s = s.replace(old, new, 1)

          # Ciclo Básico: nuevos programas recuperados del DESORDEN del 28/09.
          once("['Educación Artística',null]", "['Educación Artística','1R7K9RvaYX7zj_ZdVJjzLuRpPHsKVMWB3']")
          once("['Construcción de Ciudadanía',null]", "['Construcción de Ciudadanía','1sv--k25r279NutRWnRBEscXH_bYZBZgb']")
          once("['Construcción de Ciudadanía',null]", "['Construcción de Ciudadanía','1m8wkc9X4ruwHDVcBrxxwvTNxzH5eP6ps']")
          once("['Educación Artística',null]", "['Educación Artística','1aTPPd0nLfQgu6QVdeg4KwPOnST5UH9l2']")
          once("['Educación Artística',null]", "['Educación Artística','1RqGYSaCI8NjDF1lB1HhHUFePD_bnKV89']")

          s = s.replace('133 programas disponibles', '138 programas disponibles')
          s = s.replace('25 pendientes', '20 pendientes')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('133 programas disponibles', '138 programas disponibles')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit y push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programas.html index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git commit -m 'Actualizar programas con material del 28-09 [skip ci]'
          git push
